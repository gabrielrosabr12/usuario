name: Build do Projeto Spring Boot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env: 
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Pegar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21 # ou a versão que está usando no projeto
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Ativa cache automático de dependências

      - name: Dar permissão de execução para o Gradle
        run: chmod +x gradlew

      - name: Recriar chaves RSA para o Spring Boot
        run: |
          mkdir -p src/main/resources/keys
          echo "${{ secrets.RSA_PRIVATE_KEY_B64 }}" | base64 --decode > src/main/resources/keys/private.pem

      - name: Executar o build e testes com Gradle
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.POSTGRES_DB }}
        run: ./gradlew build -x test
