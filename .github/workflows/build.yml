name: Build do Projeto Spring Boot

# 1. O Gatilho: Quando esse workflow vai rodar?
on:
  push:
    branches: [ "main" ] # Roda sempre quando houver um push para main
  pull_request:
    branches: [ "main" ] # Roda sempre quando tentar juntar na main

  # Permite executar manualmente este fluxo a partir da guia Ações
  workflow_dispatch:

# O que esse workflow deve fazer?
jobs:
  build:
    runs-on: ubuntu-latest # Cria um terminal Linux (Ubuntu)

    # 1. Cria um banco de dados PostgreSQL temporário para o teste
    services:
      postgres:
        image: postgres:latest
        env: 
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

   
    # Passo a passo que vão rodar sequencialmente.
    steps:
      # Baixa o código do repositório para a máquina virtual
      - name: Pegar o código do repositório
        uses: actions/checkout@v4

      # Instala o Java 25
      - name: Configurar o Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Dar permissão de execução para o Gradle
        run: chmod +x gradlew

      - name: Recriar chaves RSA para o Spring Boot
        run: |
          mkdir -p src/main/resources/keys
          echo "${{ secrets.RSA_PRIVATE_KEY_B64 }}" | base64 --decode > src/main/resources/keys/private.pem


      - name: # 2. Roda o build COM OS TESTES, passando as variáveis de ambiente
        env:
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          
        run: ./gradlew build
