name: Build do Projeto Spring Boot

# 1. O Gatilho: Quando esse workflow vai rodar?
on:
  push:
    branches: [ "main" ] # Roda sempre quando houver um push para main
  pull_request:
    branches: [ "main" ] # Roda sempre quando tentar juntar na main

  # Permite executar manualmente este fluxo a partir da guia Ações
  workflow_dispatch:

# O que esse workflow deve fazer?
jobs:
  build:
    runs-on: ubuntu-latest # Cria um terminal Linux (Ubuntu)
   
    # Passo a passo que vão rodar sequencialmente.
    steps:
      # Baixa o código do repositório para a máquina virtual
      - name: Pegar o código do repositório
        uses: actions/checkout@v4

      # Instala o Java 25
      - name: Configurar o Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Dar permissão de execução para o Gradle
        run: chmod +x gradlew

      - name: Construir o projeto com Gradle (ignorando testes)
        run: ./gradlew build -x test
